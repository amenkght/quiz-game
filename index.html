<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#1b1464,#4a1d96 60%,#7b2ff7);color:#fff;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:16px 16px 40px}
h1{font-size:28px;margin:8px 0 2px;text-align:center}
.sub{text-align:center;opacity:.8;margin:0 0 14px;font-size:14px}
.card{background:rgba(255,255,255,.12);border-radius:18px;padding:14px;margin:10px 0;backdrop-filter:blur(6px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;opacity:.85}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:#ffd34d;border-radius:8px;transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.cat{background:rgba(255,255,255,.16);border-radius:16px;padding:16px 8px;font-size:18px;text-align:center;transition:transform .1s}
.cat:active,.opt:active,.btn:active{transform:scale(.97)}
.cat small{display:block;font-size:12px;opacity:.8;margin-top:4px}
.cat .e{font-size:30px;display:block}
.btn{display:block;width:100%;background:#ffd34d;color:#2a1a5e;font-weight:700;font-size:18px;border-radius:16px;padding:15px;margin:10px 0}
.btn.sec{background:rgba(255,255,255,.18);color:#fff;font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.timer{height:10px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;width:100%;background:#4ade80;transition:width .25s linear,background .3s}
.q{font-size:22px;line-height:1.5;font-weight:700;margin:14px 0;min-height:70px}
.opt{display:block;width:100%;text-align:right;background:rgba(255,255,255,.16);border-radius:14px;padding:14px 16px;margin:9px 0;font-size:18px;transition:background .2s,transform .1s}
.opt.ok{background:#16a34a}.opt.no{background:#dc2626}.opt.off{opacity:.25;pointer-events:none}
.life{display:flex;gap:8px;margin-top:6px}.life .btn{margin:0;font-size:14px;padding:10px}
.life .btn:disabled{opacity:.35}
.fact{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;line-height:1.5}
.big{font-size:56px;text-align:center;margin:10px 0 0}
.score{font-size:42px;font-weight:800;text-align:center}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.hide{display:none}
.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.tag{font-size:12px;background:rgba(255,255,255,.2);border-radius:20px;padding:2px 10px}
.link{background:none;text-decoration:underline;opacity:.7;font-size:13px;display:block;margin:14px auto 0}
</style>
</head>

["tech",2,"من مؤسس شركة مايكروسوفت؟",["بيل جيتس","ستيف جوبز","مارك زوكربيرج","إيلون ماسك"],"أسسها بيل جيتس وبول ألين عام 1975."],
["tech",2,"ما معنى AI؟",["الذكاء الاصطناعي","الإنترنت المتقدم","التطبيق الآلي","الاتصال الدولي"],"مصطلح الذكاء الاصطناعي ظهر عام 1956."],
["tech",2,"من مؤسس موقع فيسبوك؟",["مارك زوكربيرج","جاك دورسي","لاري بيج","بيل جيتس"],"أُطلق فيسبوك عام 2004 من داخل جامعة هارفارد."],
["tech",2,"أي وحدة تخزين أكبر؟",["جيجابايت","ميجابايت","كيلوبايت","بايت"],"الجيجابايت يساوي نحو 1000 ميجابايت."],
["tech",2,"ما لغة تصميم هيكل صفحات الويب؟",["HTML","Python","SQL","Java"],"HTML اختصار لـ لغة ترميز النص التشعبي."],
["tech",3,"من مخترع شبكة الويب العالمية WWW؟",["تيم بيرنرز لي","ستيف جوبز","دينيس ريتشي","لينوس تورفالدز"],"اخترعها عام 1989 أثناء عمله في سيرن."],
["tech",3,"كم بتاً في البايت الواحد؟",["8","4","16","10"],"البت أصغر وحدة معلومات: 0 أو 1."],
["tech",3,"ماذا تعني RAM؟",["ذاكرة الوصول العشوائي","وحدة المعالجة المركزية","القرص الصلب","بطاقة الشاشة"],"تُفقد بياناتها عند إطفاء الجهاز."],
["tech",3,"لغة البرمجة Python سُميت على اسم ماذا؟",["فرقة كوميدية مونتي بايثون","ثعبان","جزيرة","كوكب"],"أطلق جايدو فان روسوم الاسم تيمناً بعرض كوميدي بريطاني."],
["tech",3,"من مؤسس نظام التشغيل مفتوح المصدر لينكس؟",["لينوس تورفالدز","بيل جيتس","ستيف وزنياك","ريتشارد ستولمان"],"أطلق نواة لينكس عام 1991."]
];

const LV={1:"سهل",2:"متوسط",3:"صعب"};
const KEY="quizv2";
let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}return{points:0,games:0,correct:0,answered:0,best:0,bestStreak:0,days:0,last:"",cat:{},mute:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),app=$("#app");
const lvl=p=>Math.floor(Math.sqrt(p/60))+1;
const lvBase=l=>(l-1)*(l-1)*60;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let ac;function beep(f,d){if(S.mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function vib(n){try{if(!S.mute&&navigator.vibrate)navigator.vibrate(n)}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
function home(){
  clearInterval(G&&G.t);
  const L=lvl(S.points),b=lvBase(L),n=lvBase(L+1),pct=Math.round((S.points-b)/(n-b)*100);
  const acc=S.answered?Math.round(S.correct/S.answered*100):0;
  app.innerHTML=`<h1>🧠 تحدي المعلومات</h1><p class="sub">اختبر معلوماتك واجمع النقاط</p>
  <div class="card pop"><div class="stats"><div><b>${S.points}</b><span>نقاطك</span></div><div><b>${L}</b><span>المستوى</span></div><div><b>🔥 ${S.days}</b><span>أيام متتالية</span></div></div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="sub" style="margin:6px 0 0;font-size:12px">${n-S.points} نقطة للمستوى ${L+1}</div></div>
  <button class="btn" id="rnd">🎲 لعب عشوائي (10 أسئلة)</button>
  <div class="grid">${CATS.map(c=>`<button class="cat" data-c="${c.id}"><span class="e">${c.i}</span>${c.n}<small>أفضل: ${(S.cat[c.id]||0)}/10</small></button>`).join("")}</div>
  <div class="card" style="margin-top:14px"><div class="row"><span>أعلى نتيجة</span><b>${S.best}</b></div><div class="row"><span>أطول سلسلة صح</span><b>${S.bestStreak}</b></div><div class="row"><span>الدقة</span><b>${acc}%</b></div><div class="row" style="border:0"><span>مرات اللعب</span><b>${S.games}</b></div></div>
  <button class="btn sec" id="mute">${S.mute?"🔇 الصوت مغلق":"🔊 الصوت مفتوح"}</button>
  <button class="link" id="reset">مسح كل البيانات</button>`;
  $("#rnd").onclick=()=>start(null);
  document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>start(b.dataset.c));
  $("#mute").onclick=()=>{S.mute=!S.mute;save();home()};
  $("#reset").onclick=()=>{if(confirm("متأكد إنك عايز تمسح كل النقاط؟")){localStorage.removeItem(KEY);S=load();home()}};
}
let G=null;
function start(c){
  let pool=Q.filter(q=>!c||q[0]===c);
  let pick=[];
  [1,2,3].forEach(l=>{pick=pick.concat(shuf(pool.filter(q=>q[1]===l)).slice(0,l===1?3:l===2?4:3))});
  if(pick.length<10)pick=pick.concat(shuf(pool.filter(q=>!pick.includes(q))).slice(0,10-pick.length));
  pick=pick.slice(0,10).sort((a,b)=>a[1]-b[1]);
  G={c,qs:pick,i:0,score:0,streak:0,maxStreak:0,right:0,f:1,skip:1,locked:false,t:null,left:15};
  show();
}
function show(){
  const q=G.qs[G.i];G.opts=shuf(q[3].map((t,i)=>({t,ok:i===0})));G.locked=false;G.left=15;
  const cat=CATS.find(c=>c.id===q[0]);
  app.innerHTML=`<div class="top"><button class="tag" id="x">✕ خروج</button><span class="tag">${cat.i} ${cat.n} · ${LV[q[1]]}</span><span>⭐ ${G.score}</span></div>
  <div class="top" style="margin-top:10px"><span>سؤال ${G.i+1} / 10</span><span>${G.streak>1?"🔥 "+G.streak+" متتالية":""}</span><span id="tl">15</span></div>
  <div class="timer"><i id="tb"></i></div>
  <div class="q pop">${q[2]}</div>
  <div id="opts">${G.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join("")}</div>
  <div class="life"><button class="btn sec" id="l5" ${G.f?"":"disabled"}>✂️ حذف إجابتين</button><button class="btn sec" id="ls" ${G.skip?"":"disabled"}>⏭️ تخطي</button></div>
  <div id="fx"></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>ans(+b.dataset.i));
  $("#x").onclick=()=>{if(confirm("تخرج من اللعبة؟"))home()};
  $("#l5").onclick=()=>{if(G.locked||!G.f)return;G.f=0;shuf(G.opts.map((o,i)=>i).filter(i=>!G.opts[i].ok)).slice(0,2).forEach(i=>document.querySelector(`.opt[data-i="${i}"]`).classList.add("off"));$("#l5").disabled=true};
  $("#ls").onclick=()=>{if(G.locked||!G.skip)return;G.skip=0;G.streak=0;next()};
  clearInterval(G.t);
  G.t=setInterval(()=>{G.left-=.25;const r=Math.max(G.left,0);$("#tb").style.width=(r/15*100)+"%";$("#tb").style.background=r<5?"#ef4444":r<9?"#facc15":"#4ade80";$("#tl").textContent=Math.ceil(r);if(G.left<=0){ans(-1)}},250);
}
function ans(i){
  if(G.locked)return;G.locked=true;clearInterval(G.t);
  const q=G.qs[G.i],ok=i>=0&&G.opts[i].ok;S.answered++;
  document.querySelectorAll(".opt").forEach((b,k)=>{if(G.opts[k].ok)b.classList.add("ok");else if(k===i)b.classList.add("no")});
  let gain=0;
  if(ok){S.correct++;G.right++;G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak);gain=10+(q[1]-1)*5+Math.floor(Math.max(G.left,0)/2)+(G.streak>=3?5:0);G.score+=gain;beep(660,.15);vib(40)}else{G.streak=0;beep(200,.3);vib([80,40,80])}
  $("#fx").innerHTML=`<div class="fact pop">${ok?`✅ صح! +${gain} نقطة`:(i<0?"⏰ خلص الوقت":"❌ غلط")}<br>💡 ${q[4]}</div><button class="btn" id="nx">${G.i>=9?"شوف النتيجة":"التالي ◀"}</button>`;
  $("#nx").onclick=next;
}
function next(){clearInterval(G.t);G.i++;if(G.i>=10)return end();show()}
function end(){
  const today_=today();
  if(S.last!==today_){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.days=S.last===y?S.days+1:1;S.last=today_}
  const before=lvl(S.points);S.points+=G.score;S.games++;S.best=Math.max(S.best,G.right);S.bestStreak=Math.max(S.bestStreak,G.maxStreak);
  if(G.c)S.cat[G.c]=Math.max(S.cat[G.c]||0,G.right);
  const after=lvl(S.points);save();
  const stars=G.right>=9?3:G.right>=6?2:G.right>=3?1:0;
  app.innerHTML=`<div class="big pop">${"⭐".repeat(stars)||"💪"}</div><div class="score pop">${G.right} / 10</div>
  <p class="sub">${G.right>=9?"أسطورة! 🔥":G.right>=6?"شغل حلو، كمّل!":"حاول تاني وهتتحسن"}</p>
  <div class="card"><div class="row"><span>نقاط الجولة</span><b>+${G.score}</b></div><div class="row"><span>أطول سلسلة</span><b>${G.maxStreak}</b></div><div class="row" style="border:0"><span>إجمالي نقاطك</span><b>${S.points}</b></div></div>
  ${after>before?`<div class="card pop" style="text-align:center;font-size:20px">🎉 وصلت للمستوى ${after}!</div>`:""}
  <button class="btn" id="again">العب تاني</button>
  <button class="btn sec" id="sh">📤 شارك نتيجتك</button>
  <button class="btn sec" id="hm">القائمة الرئيسية</button>`;
  const c=G.c;
  $("#again").onclick=()=>start(c);$("#hm").onclick=home;
  $("#sh").onclick=()=>{const t=`جبت ${G.right}/10 في تحدي المعلومات! تقدر تكسب نتيجتي؟ ${location.href.split("#")[0]}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")};
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
home();
</script>
</body>
</html>
