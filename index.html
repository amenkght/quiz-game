<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;display:flex;justify-content:center;background:linear-gradient(135deg,#1b1464,#4a1d96,#7b2ff7,#2b59c3);background-size:300% 300%;animation:bg 18s ease infinite;overflow-x:hidden}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#bgf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bgf span{position:absolute;bottom:-60px;opacity:.12;animation:fl linear infinite;font-size:30px}
@keyframes fl{to{transform:translateY(-115vh) rotate(40deg)}}
#app{position:relative;z-index:1;width:100%;max-width:520px;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:6px 0 2px;text-align:center}
h2{font-size:20px;margin:6px 0}
.sub{text-align:center;opacity:.8;margin:0 0 12px;font-size:14px}
.card{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;margin:10px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;opacity:.85}
.bar{height:9px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd34d,#ff9f1c);border-radius:9px;transition:width .6s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.cat{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 8px;font-size:17px;text-align:center;transition:transform .12s,background .2s;animation:up .45s both}
.cat:active,.opt:active,.btn:active,.mode:active{transform:scale(.96)}
.cat small{display:block;font-size:12px;opacity:.8;margin-top:4px}
.cat .e{font-size:30px;display:block}
.mode{background:rgba(255,255,255,.15);border-radius:16px;padding:12px 4px;text-align:center;font-size:14px;transition:transform .12s}
.mode .e{font-size:26px;display:block}.mode small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.btn{display:block;width:100%;background:linear-gradient(180deg,#ffe07a,#ffd34d);color:#2a1a5e;font-weight:800;font-size:18px;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 4px 0 #c9a227;transition:transform .1s}
.btn.sec{background:rgba(255,255,255,.18);color:#fff;font-weight:500;box-shadow:none}
.btn:disabled{opacity:.4}
.daily{background:linear-gradient(135deg,#ff7a18,#ff3d71);border:0;text-align:right;display:flex;align-items:center;gap:12px;width:100%;color:#fff;border-radius:20px;padding:14px 16px;margin:10px 0;box-shadow:0 6px 20px rgba(255,61,113,.35);animation:pulse 2.4s infinite}
.daily.done{background:linear-gradient(135deg,#0f9b6e,#2563eb);animation:none;box-shadow:none}
.daily .e{font-size:38px}.daily b{font-size:18px;display:block}.daily small{opacity:.9;font-size:13px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:6px}
.dots{display:flex;gap:5px;justify-content:center;margin:10px 0 2px}
.dots i{width:100%;max-width:34px;height:7px;border-radius:7px;background:rgba(255,255,255,.22);transition:background .3s}
.dots i.cur{background:#fff;animation:blink 1s infinite}.dots i.ok{background:#4ade80}.dots i.no{background:#f87171}
@keyframes blink{50%{opacity:.4}}
.qwrap{position:relative}
.ring{position:absolute;left:0;top:0;width:54px;height:54px}
.ring svg{width:54px;height:54px;transform:rotate(90deg) scaleX(-1)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(255,255,255,.2)}.ring .fg{stroke:#4ade80;stroke-linecap:round;transition:stroke .3s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.q{font-size:22px;line-height:1.55;font-weight:700;margin:14px 0 14px;min-height:76px;padding-left:64px}
.opt{display:block;width:100%;text-align:right;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:14px 16px;margin:9px 0;font-size:18px;transition:background .2s,transform .1s;animation:up .4s both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt.ok{background:#16a34a;animation:glow .5s}.opt.no{background:#dc2626;animation:shake .4s}.opt.off{opacity:.2;pointer-events:none}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(74,222,128,.8)}100%{box-shadow:0 0 0 18px rgba(74,222,128,0)}}
.life{display:flex;gap:8px;margin-top:6px}.life .btn{margin:0;font-size:14px;padding:10px}
.fact{background:rgba(0,0,0,.28);border-radius:14px;padding:11px 13px;margin-top:10px;font-size:15px;line-height:1.55}
.big{font-size:60px;text-align:center;margin:6px 0 0}
.score{font-size:44px;font-weight:800;text-align:center}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12);gap:8px}
.row:last-child{border:0}
.hide{display:none}
.pop{animation:pop .4s}@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.tag{font-size:12px;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;white-space:nowrap}
.link{background:none;text-decoration:underline;opacity:.7;font-size:13px;display:block;margin:14px auto 0}
.hearts{letter-spacing:2px}
.av{font-size:44px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.me{display:flex;align-items:center;gap:14px}.me b{font-size:20px;display:block}.me span{opacity:.85;font-size:14px}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd div{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 8px;text-align:center;font-size:13px}
.bd div .e{font-size:32px;display:block;margin-bottom:4px}
.bd div.lock{opacity:.4;filter:grayscale(1)}
.toast{background:linear-gradient(135deg,#ffd34d,#ff9f1c);color:#2a1a5e;border-radius:16px;padding:12px;margin:8px 0;font-weight:700;text-align:center;animation:pop .5s}
input.nm{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:14px;border:0;text-align:center;color:#2a1a5e;margin:8px 0}
.rv{font-size:14px;line-height:1.6}.rv .row{display:block}
.rv em{font-style:normal;color:#86efac}.rv s{color:#fca5a5}
#cf{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const RAW=[["egypt",1,"ما هي عاصمة مصر؟",["القاهرة","الإسكندرية","الأقصر","أسوان"],"القاهرة تُلقب بمدينة الألف مئذنة."],["egypt",1,"ما هو أطول نهر يمر في مصر؟",["نهر النيل","نهر الفرات","نهر السين","نهر الدانوب"],"النيل يمتد لأكثر من 6600 كم، وهو من أطول أنهار العالم."],["egypt",1,"في أي محافظة تقع أهرامات الجيزة؟",["الجيزة","الأقصر","الفيوم","المنيا"],"الأهرامات الثلاثة الكبرى هي خوفو وخفرع ومنقرع."],["egypt",1,"ما هو البحر الذي يحد مصر من الشمال؟",["البحر المتوسط","البحر الأحمر","بحر العرب","البحر الأسود"],"لمصر سواحل على المتوسط شمالاً والأحمر شرقاً."],["egypt",1,"ما هي عملة مصر؟",["الجنيه","الدينار","الريال","الدرهم"],"الجنيه المصري أُصدر لأول مرة عام 1834."],["egypt",2,"من هو الملك الذي بنى الهرم الأكبر؟",["خوفو","رمسيس الثاني","توت عنخ آمون","أحمس"],"الهرم الأكبر ظل أطول مبنى صنعه الإنسان لنحو 3800 سنة."],["egypt",2,"ما اسم القناة التي تربط البحر المتوسط بالبحر الأحمر؟",["قناة السويس","قناة بنما","قناة كييل","قناة الإسماعيلية"],"قناة السويس اختصرت رحلة السفن بين أوروبا وآسيا آلاف الكيلومترات."],["egypt",2,"في أي عام افتُتحت قناة السويس للملاحة؟",["1869","1798","1952","1914"],"افتُتحت في احتفال كبير حضرته الإمبراطورة أوجيني."],["egypt",2,"أي محافظة هي الأكبر مساحة في مصر؟",["الوادي الجديد","جنوب سيناء","مطروح","أسوان"],"الوادي الجديد أكبر محافظات مصر مساحة وأقلها سكاناً."],["egypt",2,"في أي مدينة يقع معبد أبو سمبل؟",["أسوان","الأقصر","سوهاج","قنا"],"نُقل المعبد بالكامل في الستينيات لإنقاذه من مياه السد العالي."],["egypt",3,"من هو مكتشف مقبرة توت عنخ آمون عام 1922؟",["هوارد كارتر","شامبليون","نابليون","ماريت باشا"],"عُثر على أكثر من 5000 قطعة داخل المقبرة."],["egypt",3,"أي حجر ساعد شامبليون على فك رموز الهيروغليفية؟",["حجر رشيد","حجر الصوان","حجر الأساس","حجر فيلة"],"الحجر محفوظ اليوم في المتحف البريطاني."],["egypt",3,"ما الاسم القديم لمدينة الأقصر الحالية؟",["طيبة","منف","أخيتاتون","تانيس"],"كانت طيبة عاصمة مصر في عصر الدولة الحديثة وتضم معبد الكرنك."],["egypt",3,"ما اسم أكبر بحيرة صناعية في مصر خلف السد العالي؟",["بحيرة ناصر","بحيرة قارون","بحيرة المنزلة","بحي   const C=["#ffd34d","#4ade80","#f87171","#60a5fa","#c084fc","#fb923c"];

  const t0=Date.now();
  (function f(){x.clearRect(0,0,cv.width,cv.height);if(Date.now()-t0>2600)return;P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});requestAnimationFrame(f)})();
}

function ordered(pool,r){const u=pool.filter(q=>!S.seen[q.id]),s=pool.filter(q=>S.seen[q.id]);return shuf(u,r).concat(shuf(s,r))}
function pick10(pool,r){
  if(pool.filter(q=>!S.seen[q.id]).length<10){pool.forEach(q=>delete S.seen[q.id])}
  let p=[];[[1,3],[2,4],[3,3]].forEach(([l,n])=>{p=p.concat(ordered(pool.filter(q=>q.l===l),r).slice(0,n))});
  if(p.length<10)p=p.concat(ordered(pool.filter(q=>!p.includes(q)),r).slice(0,10-p.length));
  return p.slice(0,10).sort((a,b)=>a.l-b.l);
}

  const acc=S.answered?Math.round(S.correct/S.answered*100):0;
  app.innerHTML=back("📊 إحصائياتي")+`<div class="card" style="margin-top:12px"><div class="row"><span>إجمالي النقاط</span><b>${S.points}</b></div><div class="row"><span>مرات اللعب</span><b>${S.games}</b></div><div class="row"><span>الدقة</span><b>${acc}%</b></div><div class="row"><span>إجابات صحيحة</span><b>${S.correct}</b></div><div class="row"><span>أعلى نتيجة (10 أسئلة)</span><b>${S.best}</b></div><div class="row"><span>أطول سلسلة صح</span><b>${S.bestStreak}</b></div><div class="row"><span>أفضل تحدي دقيقة</span><b>${S.bestBlitz}</b></div><div class="row"><span>أفضل وضع بقاء</span><b>${S.bestSurv}</b></div><div class="row"><span>أيام التحدي اليومي المكتملة</span><b>${Object.keys(S.daily).length}</b></div></div>
  <h2>أفضل نتيجة بكل قسم</h2><div class="card">${CATS.map(c=>`<div class="row"><span>${c.i} ${c.n}</span><b>${S.cat[c.id]||0}/10</b></div>`).join("")}</div>`;$("#bk").onclick=home;
}
function settings(){
  app.innerHTML=back("⚙️ الإعدادات")+`<div class="card" style="margin-top:12px"><button class="btn sec" id="mute" style="margin-top:0">${S.mute?"🔇 الصوت والاهتزاز مغلقين":"🔊 الصوت والاهتزاز مفتوحين"}</button><button class="btn sec" id="nmb">✏️ غيّر اسمك (${esc(S.name)})</button><button class="btn sec" id="rs" style="margin-bottom:0">🗑️ مسح كل البيانات</button></div><p class="sub">بياناتك محفوظة على موبايلك فقط.</p>`;
  $("#bk").onclick=home;$("#mute").onclick=()=>{S.mute=!S.mute;save();settings()};
  $("#nmb").onclick=()=>{const n=prompt("اسمك:",S.name);if(n&&n.trim()){S.name=n.trim().slice(0,14);save();settings()}};
  $("#rs").onclick=()=>{if(confirm("متأكد إنك عايز تمسح كل النقاط والإنجازات؟")){localStorage.removeItem(KEY);localStorage.removeItem("quizv2");S=load();home()}};
}
// ---------- game
function start(mode,c){
  const pool=Q.filter(q=>!c||q.c===c);
  G={mode,c:c||null,i:0,score:0,streak:0,maxStreak:0,right:0,wrong:[],dots:[],f:1,skip:1,lives:3,locked:false,t:null,limit:mode==="survival"?12:15,qs:[],total:10,rnd:Math.random};
  if(mode==="daily"){const r=rngFor("daily-"+today());G.rnd=r;let p=[];[[1,3],[2,4],[3,3]].forEach(([l,n])=>{p=p.concat(shuf(Q.filter(q=>q.l===l),r).slice(0,n))});G.qs=p}
  else if(mode==="blitz"){G.qs=ordered(pool);G.total=Infinity;G.deadline=Date.now()+60000}
  else if(mode==="survival"){const o=l=>ordered(pool.filter(q=>q.l===l));G.qs=o(1).slice(0,6).concat(o(2).slice(0,8),o(3),o(1).slice(6),o(2).slice(8));G.total=G.qs.length}
  else G.qs=pick10(pool,Math.random);
  show();
}
function ringHTML(){return `<div class="ring"><svg viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="23"/><circle class="fg" id="rg" cx="27" cy="27" r="23" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg><b id="tl">${G.mode==="blitz"?60:G.limit}</b></div>`}
function show(){
  if(G.i>=G.qs.length)return end();
  const q=G.qs[G.i];G.q=q;G.locked=false;
  const r=G.mode==="daily"?G.rnd:Math.random;
  G.opts=shuf(q.o.map((t,i)=>({t,ok:i===0})),r);
  const cat=CATS.find(c=>c.id===q.c);
  const modeName={normal:"",daily:"🎁 تحدي اليوم · ",blitz:"⚡ ",survival:"🛡️ "}[G.mode];
  const mid=G.mode==="blitz"?`<span>✅ ${G.right}</span>`:G.mode==="survival"?`<span class="hearts">${"❤️".repeat(G.lives)||"💔"}</span>`:`<span>سؤال ${G.i+1} / ${G.total}</span>`;
  const dots=G.total!==Infinity&&G.mode!=="survival"?`<div class="dots">${Array.from({length:G.total},(_,i)=>`<i class="${i<G.dots.length?G.dots[i]:i===G.i?"cur":""}"></i>`).join("")}</div>`:"";
  app.innerHTML=`<div class="top"><button class="tag" id="x">✕ خروج</button><span class="tag">${modeName}${cat.i} ${cat.n} · ${LV[q.l]}</span><span>⭐ ${G.score}</span></div>
  <div class="top" style="margin-top:10px">${mid}<span>${G.streak>1?"🔥 "+G.streak+" متتالية":""}</span></div>${dots}
  <div class="qwrap"><div class="q pop">${esc(q.q)}</div>${ringHTML()}</div>
  <div id="opts">${G.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>
  ${G.mode==="blitz"?"":`<div class="life"><button class="btn sec" id="l5" ${G.f?"":"disabled"}>✂️ حذف إجابتين</button><button class="btn sec" id="ls" ${G.skip?"":"disabled"}>⏭️ تخطي</button></div>`}
  <div id="fx"></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>ans(+b.dataset.i));
  $("#x").onclick=()=>{if(confirm("تخرج من اللعبة؟ مش هتتحسب النقاط."))home()};
  if(G.mode!=="blitz"){
    $("#l5").onclick=()=>{if(G.locked||!G.f)return;G.f=0;shuf(G.opts.map((o,i)=>i).filter(i=>!G.opts[i].ok)).slice(0,2).forEach(i=>document.querySelector(`.opt[data-i="${i}"]`).classList.add("off"));$("#l5").disabled=true};
    $("#ls").onclick=()=>{if(G.locked||!G.skip)return;G.skip=0;G.streak=0;G.dots.push("no");next()};
  }
  clearInterval(G.t);
  G.qstart=Date.now();if(G.mode!=="blitz")G.deadline=G.qstart+G.limit*1000;
  const span=G.mode==="blitz"?60:G.limit;
  G.t=setInterval(()=>{const left=Math.max((G.deadline-Date.now())/1000,0);G.left=left;const rg=$("#rg");if(!rg)return;rg.style.strokeDashoffset=144.5*(1-left/span);rg.style.stroke=left<5?"#ef4444":left<9?"#facc15":"#4ade80";$("#tl").textContent=Math.ceil(left);if(left<=0){if(G.mode==="blitz"){clearInterval(G.t);G.locked=true;end()}else ans(-1)}},100);
}
function ans(i){
  if(G.locked)return;G.locked=true;
  if(G.mode!=="blitz")clearInterval(G.t);
  const q=G.q,ok=i>=0&&G.opts[i].ok;S.answered++;S.seen[q.id]=Date.now();
  document.querySelectorAll(".opt").forEach((b,k)=>{if(G.opts[k].ok)b.classList.add("ok");else if(k===i)b.classList.add("no")});
  let gain=0;
  if(ok){S.correct++;G.right++;G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak);
    gain=G.mode==="blitz"?8+(G.streak>=3?2:0):10+(q.l-1)*5+Math.floor(Math.max(G.left||0,0)/2)+(G.streak>=3?5:0);
    G.score+=gain;G.dots.push("ok");beep(660,.15);setTimeout(()=>beep(880,.12),90);vib(40)}
  else{G.streak=0;G.dots.push("no");G.wrong.push({q:q.q,a:q.o[0],y:i>=0?G.opts[i].t:"انتهى الوقت"});beep(200,.3,"sawtooth");vib([80,40,80]);if(G.mode==="survival")G.lives--}
  const dead=G.mode==="survival"&&G.lives<=0;
  if(G.mode==="blitz"){setTimeout(()=>{if(G.locked&&Date.now()<G.deadline){G.i++;show()}},650);return}
  const last=dead||G.i>=G.qs.length-1||(G.mode!=="survival"&&G.i>=G.total-1);
  $("#fx").innerHTML=`<div class="fact pop">${ok?`✅ صح! +${gain} نقطة`:(i<0?"⏰ خلص الوقت":"❌ غلط"+(dead?" · خلصت الأرواح 💔":""))}<br>💡 ${esc(q.f)}</div><button class="btn" id="nx">${last?"شوف النتيجة":"التالي ◀"}</button>`;
  $("#nx").onclick=()=>last?end():next();
  $("#nx").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){clearInterval(G.t);G.i++;show()}
function end(){
  clearInterval(G.t);
  const t0=today();
  if(S.last!==t0){S.days=S.last===yest()?S.days+1:1;S.last=t0}
  const before=lvl(S.points);
  let bonus=0;
  if(G.mode==="daily"){bonus=G.score;if(S.dailyLast===yest())S.dailyStreak++;else S.dailyStreak=1;S.dailyLast=t0;S.daily[t0]={right:G.right,score:G.score+bonus,dots:G.dots.slice()}}
  const total=G.score+bonus;
  S.points+=total;S.games++;
  if(G.mode==="normal"||G.mode==="daily"){S.best=Math.max(S.best,G.right);if(G.right===10)S.perfect++;if(G.mode==="normal"&&G.c)S.cat[G.c]=Math.max(S.cat[G.c]||0,G.right)}
  if(G.mode==="blitz")S.bestBlitz=Math.max(S.bestBlitz,G.right);
  if(G.mode==="survival")S.bestSurv=Math.max(S.bestSurv,G.right);
  S.bestStreak=Math.max(S.bestStreak,G.maxStreak);
  const after=lvl(S.points),newb=[];
  BADGES.forEach(b=>{if(!S.badges[b[0]]&&b[4](S)){S.badges[b[0]]=Date.now();newb.push(b)}});
  save();
  const denom=G.mode==="blitz"||G.mode==="survival"?null:G.total;
  const good=denom?G.right/denom>=.6:G.right>=8;
  const stars=denom?(G.right/denom>=.9?3:G.right/denom>=.6?2:G.right/denom>=.3?1:0):(G.right>=12?3:G.right>=7?2:G.right>=3?1:0);
  const head={normal:"نتيجتك",daily:"تحدي اليوم",blitz:"تحدي الدقيقة",survival:"وضع البقاء"}[G.mode];
  const msg=good?"أسطورة! 🔥":stars>=1?"شغل حلو، كمّل!":"حاول تاني وهتتحسن";
  app.innerHTML=`<p class="sub" style="margin-top:6px">${head}</p><div class="big pop">${"⭐".repeat(stars)||"💪"}</div><div class="score pop" id="sc">0</div>
  <p class="sub">${msg}</p>
  <div class="card"><div class="row"><span>إجابات صحيحة</span><b>${G.right}${denom?" / "+denom:""}</b></div><div class="row"><span>نقاط الجولة</span><b>+${G.score}</b></div>${bonus?`<div class="row"><span>🎁 مكافأة التحدي اليومي ×2</span><b>+${bonus}</b></div><div class="row"><span>🔥 سلسلة التحدي اليومي</span><b>${S.dailyStreak}</b></div>`:""}<div class="row"><span>أطول سلسلة</span><b>${G.maxStreak}</b></div><div class="row"><span>إجمالي نقاطك</span><b>${S.points}</b></div></div>
  ${after>before?`<div class="toast">🎉 وصلت للمستوى ${after} · ${TITLES[Math.min(after-1,7)]}!</div>`:""}
  ${newb.map(b=>`<div class="toast">${b[1]} إنجاز جديد: ${b[2]}</div>`).join("")}
  ${G.wrong.length?`<button class="btn sec" id="rv">🧐 راجع الأخطاء (${G.wrong.length})</button><div class="card rv hide" id="rvl">${G.wrong.map(w=>`<div class="row"><b>${esc(w.q)}</b><em>✔ ${esc(w.a)}</em><s>✖ ${esc(w.y)}</s></div>`).join("")}</div>`:""}
  ${G.mode==="daily"?"":`<button class="btn" id="again">العب تاني</button>`}
  <button class="btn sec" id="sh">📤 شارك نتيجتك</button>
  <button class="btn sec" id="hm">القائمة الرئيسية</button>`;
  const res0=G,sc=$("#sc"),t1=Date.now();
  (function c(){const p=Math.min((Date.now()-t1)/900,1);sc.textContent=Math.round(res0.right*p)+(denom?" / "+denom:"");if(p<1)requestAnimationFrame(c)})();
  if(good||after>before){confetti();jingle([523,659,784,1047])}else if(stars)jingle([523,659])
  const mode=G.mode,c=G.c,res=G;
  if($("#again"))$("#again").onclick=()=>start(mode,c);
  $("#hm").onclick=home;
  if($("#rv"))$("#rv").onclick=()=>{$("#rvl").classList.toggle("hide")};
  $("#sh").onclick=()=>share(res);
}
function share(r){
  const url=location.href.split("#")[0].split("?")[0];let t;
  if(r.mode==="daily")t=`🎁 تحدي المعلومات اليومي ${today()}\n${r.dots.map(d=>d==="ok"?"🟩":"🟥").join("")}\nجبت ${r.right}/10 — تقدر تكسبني؟\n${url}`;
  else if(r.mode==="blitz")t=`⚡ جاوبت ${r.right} سؤال صح في دقيقة بتحدي المعلومات! تقدر تكسبني؟\n${url}`;
  else if(r.mode==="survival")t=`🛡️ عديت ${r.right} سؤال صح في وضع البقاء بتحدي المعلومات! تقدر تكسبني؟\n${url}`;
  else t=`جبت ${r.right}/10 في تحدي المعلومات! تقدر تكسب نتيجتي؟\n${url}`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
}
function result_daily(){
  const d=dailyState();
  app.innerHTML=`<p class="sub" style="margin-top:6px">تحدي اليوم</p><div class="big pop">✅</div><div class="score pop">${d.right} / 10</div><p class="sub">خلصت تحدي النهارده. ارجع بكرة لتحدي جديد!</p>
  <div class="card"><div class="dots" style="margin:0 0 8px">${d.dots.map(x=>`<i class="${x}"></i>`).join("")}</div><div class="row"><span>نقاط التحدي</span><b>+${d.score}</b></div><div class="row"><span>🔥 سلسلة التحدي اليومي</span><b>${S.dailyStreak}</b></div></div>
  <button class="btn" id="sh">📤 تحدّى صحابك</button><button class="btn sec" id="hm">القائمة الرئيسية</button>`;
  $("#hm").onclick=home;$("#sh").onclick=()=>share({mode:"daily",right:d.right,dots:d.dots});
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
home();
</script>
